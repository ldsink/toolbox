name: Publish Python Slim

on:
  push:
    branches: [main]
    paths:
      - 'images/python-slim/**'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read image version
        id: version
        run: |
          version=$(sed -n 's/^ARG VERSION=//p' images/python-slim/Dockerfile)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./images/python-slim
          push: true
          tags: ghcr.io/ldsink/python:${{ steps.version.outputs.value }}-slim
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=python-slim
          cache-to: type=gha,scope=python-slim,mode=max
